spring.application.name=room-reservation

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/room_reservation}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# No compose há os serviços db e app; ao rodar localmente, suba apenas o banco.
spring.docker.compose.start.arguments=db
spring.docker.compose.stop.arguments=db

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.reminder.fixed-delay-ms=60000
